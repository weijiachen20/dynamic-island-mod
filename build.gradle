plugins {
    // 26.1+ uses the non-remapping Loom plugin (Minecraft is no longer obfuscated).
    id 'net.fabricmc.fabric-loom' version '1.17.9'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    // ModMenu (Terraformers) - used for the optional config screen button
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No mappings needed — Minecraft 26.1 ships unobfuscated (Mojang official names).
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // ModMenu is optional; the mod loads fine without it.
    if (project.hasProperty('modmenu_version')) {
        compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    }

    // ImGui (Dear ImGui for Java) — powers the standalone settings screen.
    // Loom 默认只把 `include` 的依赖打包进 mod jar；若只用 implementation，
    // 运行时会出现 NoClassDefFoundError: imgui/ImGui。
    // imgui-java-app 只是纯聚合 POM（jar 内无 class）；真正的类都在
    // imgui-java-binding 里（ImGui/ImGuiIO/ImDrawData 等 JNI 类），因此
    // 直接 include binding + per-OS natives。排除 LWJGL：MC 自带 3.4.1。
    def imguiVersion = "1.86.11"
    implementation("io.github.spair:imgui-java-binding:${imguiVersion}") { exclude group: "org.lwjgl" }
    include("io.github.spair:imgui-java-binding:${imguiVersion}") { exclude group: "org.lwjgl" }
    for (String os in ["windows", "linux", "macos"]) {
        String artifact = "io.github.spair:imgui-java-natives-${os}:${imguiVersion}"
        runtimeOnly(artifact) { exclude group: "org.lwjgl" }
        include(artifact) { exclude group: "org.lwjgl" }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
